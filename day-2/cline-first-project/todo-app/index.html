<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Todo App</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />

    <style>
        /* ── CSS Custom Properties ── */
        :root {
            --color-bg: #f0f2f5;
            --color-surface: #ffffff;
            --color-primary: #6366f1;
            --color-primary-hover: #4f46e5;
            --color-primary-light: #eef2ff;
            --color-danger: #ef4444;
            --color-danger-hover: #dc2626;
            --color-complete: #22c55e;
            --color-text: #1e293b;
            --color-text-secondary: #64748b;
            --color-text-muted: #94a3b8;
            --color-border: #e2e8f0;
            --color-border-focus: #6366f1;
            --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.05);
            --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -2px rgba(0, 0, 0, 0.1);
            --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -4px rgba(0, 0, 0, 0.1);
            --radius: 12px;
            --radius-sm: 8px;
            --transition: 200ms ease;
            --font: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        /* ── Reset ── */
        *,
        *::before,
        *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            font-size: 16px;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        body {
            font-family: var(--font);
            background: var(--color-bg);
            color: var(--color-text);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            padding: clamp(1rem, 5vw, 3rem) 1rem;
            line-height: 1.6;
        }

        /* ── Container ── */
        .app {
            width: 100%;
            max-width: 580px;
            background: var(--color-surface);
            border-radius: var(--radius);
            box-shadow: var(--shadow-lg);
            padding: clamp(1.25rem, 4vw, 2rem);
            align-self: start;
        }

        /* ── Header ── */
        .app-header {
            text-align: center;
            margin-bottom: 1.5rem;
        }

        .app-header h1 {
            font-size: clamp(1.5rem, 4vw, 2rem);
            font-weight: 700;
            color: var(--color-primary);
            letter-spacing: -0.025em;
        }

        .app-header p {
            color: var(--color-text-secondary);
            font-size: 0.875rem;
            margin-top: 0.25rem;
        }

        /* ── Add Task Form ── */
        .add-task-form {
            display: flex;
            gap: 0.5rem;
            margin-bottom: 1.25rem;
        }

        .add-task-form input {
            flex: 1;
            padding: 0.75rem 1rem;
            border: 2px solid var(--color-border);
            border-radius: var(--radius-sm);
            font-size: 0.95rem;
            font-family: var(--font);
            outline: none;
            transition: border-color var(--transition), box-shadow var(--transition);
        }

        .add-task-form input:focus {
            border-color: var(--color-border-focus);
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.15);
        }

        .add-task-form input::placeholder {
            color: var(--color-text-muted);
        }

        .add-task-form button {
            padding: 0.75rem 1.25rem;
            background: var(--color-primary);
            color: #fff;
            border: none;
            border-radius: var(--radius-sm);
            font-size: 0.95rem;
            font-weight: 600;
            font-family: var(--font);
            cursor: pointer;
            transition: background var(--transition), transform var(--transition);
            white-space: nowrap;
        }

        .add-task-form button:hover:not(:disabled) {
            background: var(--color-primary-hover);
            transform: translateY(-1px);
        }

        .add-task-form button:active:not(:disabled) {
            transform: translateY(0);
        }

        .add-task-form button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* ── Filter Bar ── */
        .filter-bar {
            display: flex;
            gap: 0.25rem;
            margin-bottom: 1rem;
            background: var(--color-bg);
            border-radius: var(--radius-sm);
            padding: 0.25rem;
        }

        .filter-bar button {
            flex: 1;
            padding: 0.5rem 0.75rem;
            border: none;
            background: transparent;
            border-radius: 6px;
            font-size: 0.85rem;
            font-weight: 500;
            font-family: var(--font);
            color: var(--color-text-secondary);
            cursor: pointer;
            transition: background var(--transition), color var(--transition), box-shadow var(--transition);
        }

        .filter-bar button:hover {
            color: var(--color-text);
        }

        .filter-bar button.active {
            background: var(--color-surface);
            color: var(--color-primary);
            box-shadow: var(--shadow-sm);
            font-weight: 600;
        }

        /* ── Stats ── */
        .stats {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.75rem 0;
            border-bottom: 1px solid var(--color-border);
            margin-bottom: 0.5rem;
            font-size: 0.85rem;
            color: var(--color-text-secondary);
        }

        .stats .count {
            font-weight: 600;
            color: var(--color-text);
        }

        .stats .clear-btn {
            background: none;
            border: none;
            color: var(--color-danger);
            font-size: 0.85rem;
            font-family: var(--font);
            font-weight: 500;
            cursor: pointer;
            padding: 0.25rem 0.5rem;
            border-radius: 4px;
            transition: background var(--transition);
        }

        .stats .clear-btn:hover {
            background: rgba(239, 68, 68, 0.1);
        }

        /* ── Task List ── */
        .task-list {
            list-style: none;
            min-height: 120px;
        }

        .task-list .empty-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 2.5rem 1rem;
            color: var(--color-text-muted);
            text-align: center;
        }

        .task-list .empty-state .empty-icon {
            font-size: 2.5rem;
            margin-bottom: 0.75rem;
            opacity: 0.5;
        }

        .task-list .empty-state .empty-title {
            font-size: 1rem;
            font-weight: 600;
            color: var(--color-text-secondary);
        }

        .task-list .empty-state .empty-sub {
            font-size: 0.85rem;
            margin-top: 0.25rem;
        }

        /* ── Task Item ── */
        .task-item {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            padding: 0.75rem 0.5rem;
            border-bottom: 1px solid var(--color-border);
            transition: background var(--transition);
            border-radius: 4px;
        }

        .task-item:hover {
            background: var(--color-primary-light);
        }

        .task-item:last-child {
            border-bottom: none;
        }

        /* Custom Checkbox */
        .task-item .checkbox-wrapper {
            position: relative;
            flex-shrink: 0;
        }

        .task-item .checkbox-wrapper input[type="checkbox"] {
            position: absolute;
            opacity: 0;
            width: 0;
            height: 0;
            cursor: pointer;
        }

        .task-item .checkbox-wrapper .checkmark {
            display: block;
            width: 22px;
            height: 22px;
            border: 2px solid var(--color-border);
            border-radius: 6px;
            cursor: pointer;
            transition: background var(--transition), border-color var(--transition), transform var(--transition);
            position: relative;
        }

        .task-item .checkbox-wrapper input[type="checkbox"]:focus-visible+.checkmark {
            outline: 2px solid var(--color-primary);
            outline-offset: 2px;
        }

        .task-item .checkbox-wrapper input[type="checkbox"]:checked+.checkmark {
            background: var(--color-complete);
            border-color: var(--color-complete);
        }

        .task-item .checkbox-wrapper input[type="checkbox"]:checked+.checkmark::after {
            content: '';
            position: absolute;
            left: 6px;
            top: 2px;
            width: 6px;
            height: 11px;
            border: solid #fff;
            border-width: 0 2px 2px 0;
            transform: rotate(45deg);
        }

        .task-item .checkbox-wrapper input[type="checkbox"]:checked+.checkmark:hover {
            transform: scale(1.1);
        }

        /* Task Text */
        .task-item .task-text {
            flex: 1;
            font-size: 0.95rem;
            word-break: break-word;
            overflow-wrap: break-word;
            hyphens: auto;
            padding: 0.1rem 0;
            transition: color var(--transition), text-decoration var(--transition);
        }

        .task-item.completed .task-text {
            color: var(--color-text-muted);
            text-decoration: line-through;
        }

        /* Delete Button */
        .task-item .delete-btn {
            flex-shrink: 0;
            width: 32px;
            height: 32px;
            border: none;
            background: transparent;
            border-radius: 6px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--color-text-muted);
            font-size: 1.1rem;
            transition: background var(--transition), color var(--transition);
            opacity: 0;
        }

        .task-item:hover .delete-btn,
        .task-item .delete-btn:focus-visible {
            opacity: 1;
        }

        .task-item .delete-btn:hover {
            background: rgba(239, 68, 68, 0.12);
            color: var(--color-danger);
        }

        .task-item .delete-btn:focus-visible {
            opacity: 1;
            outline: 2px solid var(--color-danger);
            outline-offset: 2px;
        }

        /* ── Toast / Notification ── */
        .toast {
            position: fixed;
            bottom: 1.5rem;
            left: 50%;
            transform: translateX(-50%) translateY(80px);
            background: var(--color-text);
            color: #fff;
            padding: 0.75rem 1.5rem;
            border-radius: var(--radius-sm);
            font-size: 0.9rem;
            font-family: var(--font);
            box-shadow: var(--shadow-lg);
            opacity: 0;
            transition: opacity 300ms ease, transform 300ms ease;
            pointer-events: none;
            z-index: 100;
            max-width: 90vw;
            text-align: center;
        }

        .toast.visible {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        /* ── Responsive Tweaks ── */
        @media (max-width: 480px) {
            .app {
                padding: 1rem;
                border-radius: var(--radius-sm);
            }

            .add-task-form {
                flex-direction: column;
            }

            .add-task-form button {
                width: 100%;
            }

            .task-item .delete-btn {
                opacity: 1;
            }

            .stats {
                flex-wrap: wrap;
                gap: 0.5rem;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                transition-duration: 0.01ms !important;
                animation-duration: 0.01ms !important;
            }
        }

        /* ── Scrollbar Styling ── */
        .task-list::-webkit-scrollbar {
            width: 6px;
        }
        .task-list::-webkit-scrollbar-track {
            background: transparent;
        }
        .task-list::-webkit-scrollbar-thumb {
            background: var(--color-border);
            border-radius: 3px;
        }
        .task-list::-webkit-scrollbar-thumb:hover {
            background: var(--color-text-muted);
        }
    </style>
</head>

<body>

    <main class="app" role="main">
        <!-- Header -->
        <header class="app-header">
            <h1>Todo App</h1>
            <p>Stay organized, get things done</p>
        </header>

        <!-- Add Task Form -->
        <form class="add-task-form" id="addTaskForm" autocomplete="off">
            <label for="taskInput" class="sr-only" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0;">New task</label>
            <input
            type="text"
            id="taskInput"
            placeholder="What needs to be done?"
            maxlength="500"
            aria-describedby="charLimitHint"
            />
            <button type="submit" id="addBtn" disabled>Add Task</button>
            <span id="charLimitHint" hidden>Maximum 500 characters</span>
        </form>

        <!-- Filter Bar -->
        <div class="filter-bar" role="group" aria-label="Filter tasks">
            <button type="button" class="active" data-filter="all">All</button>
            <button type="button" data-filter="active">Active</button>
            <button type="button" data-filter="completed">Completed</button>
        </div>

        <!-- Stats -->
        <div class="stats">
            <span>
                <span class="count" id="totalCount">0</span> tasks
                (<span id="completedCount">0</span> done)
            </span>
            <button class="clear-btn" id="clearCompletedBtn" title="Remove all completed tasks">
                Clear completed
            </button>
        </div>

        <!-- Task List -->
        <ul class="task-list" id="taskList" role="list" aria-label="Tasks">
            <!-- Dynamically rendered -->
        </ul>
    </main>

    <!-- Toast Notification -->
    <div class="toast" id="toast" role="alert" aria-live="polite"></div>

    <script>
        (function() {
            'use strict';

            // ─── State ────────────────────────────────────────────────
            let tasks = [];
            let currentFilter = 'all';
            let nextId = 1;

            const STORAGE_KEY = 'todo-app-tasks';
            const MAX_TASKS = 500;

            // ─── DOM References ───────────────────────────────────────
            const form = document.getElementById('addTaskForm');
            const input = document.getElementById('taskInput');
            const addBtn = document.getElementById('addBtn');
            const taskList = document.getElementById('taskList');
            const totalCount = document.getElementById('totalCount');
            const completedCount = document.getElementById('completedCount');
            const clearCompletedBtn = document.getElementById('clearCompletedBtn');
            const toast = document.getElementById('toast');
            const filterBtns = document.querySelectorAll('.filter-bar button');

            let toastTimer = null;

            // ─── Local Storage ────────────────────────────────────────
            function saveToStorage() {
                try {
                    const data = { tasks, nextId };
                    localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
                } catch (e) {
                    if (e.name === 'QuotaExceededError' || e.code === 22) {
                        showToast('Storage is full. Please clear some completed tasks.');
                    } else {
                        console.warn('Failed to save to localStorage:', e);
                    }
                }
            }

            function loadFromStorage() {
                try {
                    const raw = localStorage.getItem(STORAGE_KEY);
                    if (!raw) return false;

                    const data = JSON.parse(raw);

                    // Validate structure
                    if (!data || typeof data !== 'object') return false;
                    if (!Array.isArray(data.tasks)) return false;
                    if (typeof data.nextId !== 'number' || data.nextId < 1) return false;

                    // Validate each task
                    tasks = data.tasks.filter(t =>
                        t &&
                        typeof t.id === 'number' &&
                        typeof t.text === 'string' &&
                        typeof t.completed === 'boolean' &&
                        t.text.trim().length > 0
                    ).map(t => ({
                        id: t.id,
                        text: t.text.trim(),
                        completed: t.completed,
                        createdAt: t.createdAt || Date.now()
                    }));

                    nextId = data.nextId;

                    // Recover nextId if needed
                    const maxId = tasks.reduce((max, t) => Math.max(max, t.id), 0);
                    if (nextId <= maxId) {
                        nextId = maxId + 1;
                    }

                    return tasks.length > 0;
                } catch (e) {
                    console.warn('Failed to load tasks from localStorage:', e);
                    return false;
                }
            }

            // ─── Toast ────────────────────────────────────────────────
            function showToast(message, duration) {
                duration = duration || 2500;
                toast.textContent = message;
                toast.classList.add('visible');

                if (toastTimer) clearTimeout(toastTimer);
                toastTimer = setTimeout(() => {
                    toast.classList.remove('visible');
                }, duration);
            }

            // ─── Helpers ──────────────────────────────────────────────
            function generateId() {
                return nextId++;
            }

            function sanitize(text) {
                return text.trim();
            }

            function getFilteredTasks() {
                if (currentFilter === 'active') {
                    return tasks.filter(t => !t.completed);
                }
                if (currentFilter === 'completed') {
                    return tasks.filter(t => t.completed);
                }
                return tasks;
            }

            function updateStats() {
                const total = tasks.length;
                const done = tasks.filter(t => t.completed).length;
                totalCount.textContent = total;
                completedCount.textContent = done;
                clearCompletedBtn.style.display = done > 0 ? 'inline-block' : 'none';
            }

            // ─── Render ───────────────────────────────────────────────
            function render() {
                const filtered = getFilteredTasks();

                if (filtered.length === 0) {
                    let message = '';
                    let icon = '📋';
                    if (currentFilter === 'active') {
                        message = 'No active tasks — you\'re all caught up!';
                        icon = '🎉';
                    } else if (currentFilter === 'completed') {
                        message = 'No completed tasks yet. Get started!';
                        icon = '📝';
                    } else {
                        message = 'No tasks yet. Add one above!';
                        icon = '📋';
                    }
                    taskList.innerHTML =
                        `<li class="empty-state" role="status">
                    <div class="empty-icon">${icon}</div>
                    <div class="empty-title">${message}</div>
                  </li>`;
                } else {
                    let html = '';
                    for (const task of filtered) {
                        const checked = task.completed ? 'checked' : '';
                        html += `
                    <li class="task-item ${task.completed ? 'completed' : ''}" data-id="${task.id}">
                      <div class="checkbox-wrapper">
                        <input type="checkbox" id="check-${task.id}" ${checked} aria-label="Mark "${escapeHtml(task.text)}" as ${task.completed ? 'incomplete' : 'complete'}"" />
                        <label for="check-${task.id}" class="checkmark" aria-hidden="true"></label>
                      </div>
                      <span class="task-text">${escapeHtml(task.text)}</span>
                      <button class="delete-btn" aria-label="Delete "${escapeHtml(task.text)}"" title="Delete task">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                          <polyline points="3 6 5 6 21 6"></polyline>
                          <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
                          <line x1="10" y1="11" x2="10" y2="17"></line>
                          <line x1="14" y1="11" x2="14" y2="17"></line>
                        </svg>
                      </button>
                    </li>`;
                    }
                    taskList.innerHTML = html;
                }

                updateStats();

                // Update active filter button style
                filterBtns.forEach(btn => {
                    const filter = btn.getAttribute('data-filter');
                    btn.classList.toggle('active', filter === currentFilter);
                });
            }

            // Simple escape to prevent XSS
            function escapeHtml(text) {
                const div = document.createElement('div');
                div.appendChild(document.createTextNode(text));
                return div.innerHTML;
            }

            // ─── CRUD Operations ──────────────────────────────────────
            function addTask(text) {
                text = sanitize(text);
                if (!text) return;

                if (tasks.length >= MAX_TASKS) {
                    showToast(`Maximum of ${MAX_TASKS} tasks reached. Please delete some first.`);
                    return;
                }

                const task = {
                    id: generateId(),
                    text: text,
                    completed: false,
                    createdAt: Date.now()
                };
                tasks.push(task);
                saveToStorage();
                render();
                showToast('Task added!');
                input.focus();
            }

            function deleteTask(id) {
                const task = tasks.find(t => t.id === id);
                if (!task) return;

                tasks = tasks.filter(t => t.id !== id);
                saveToStorage();
                render();
                showToast(`Deleted "${task.text.length > 40 ? task.text.slice(0, 40) + '...' : task.text}"`);
            }

            function toggleTask(id) {
                const task = tasks.find(t => t.id === id);
                if (!task) return;

                task.completed = !task.completed;
                saveToStorage();
                render();
                if (task.completed) {
                    showToast('Task completed! 🎉');
                }
            }

            function clearCompleted() {
                const completed = tasks.filter(t => t.completed);
                if (completed.length === 0) return;

                tasks = tasks.filter(t => !t.completed);
                saveToStorage();
                render();
                showToast(`Cleared ${completed.length} completed task${completed.length > 1 ? 's' : ''}`);
            }

            // ─── Event Handlers ───────────────────────────────────────

            // Form submit
            form.addEventListener('submit', function(e) {
                e.preventDefault();
                const text = sanitize(input.value);
                if (text) {
                    addTask(text);
                    input.value = '';
                    addBtn.disabled = true;
                }
            });

            // Input validation
            input.addEventListener('input', function() {
                const text = sanitize(this.value);
                addBtn.disabled = text.length === 0;
            });

            // Keyboard shortcut: Escape to clear input
            input.addEventListener('keydown', function(e) {
                if (e.key === 'Escape') {
                    this.value = '';
                    addBtn.disabled = true;
                    this.blur();
                }
            });

            // Event delegation for task list (toggle & delete)
            taskList.addEventListener('click', function(e) {
                const taskItem = e.target.closest('.task-item');
                if (!taskItem) return;

                const id = Number(taskItem.getAttribute('data-id'));
                if (isNaN(id)) return;

                // Checkbox toggle
                const checkbox = e.target.closest('.checkbox-wrapper');
                if (checkbox) {
                    e.preventDefault();
                    toggleTask(id);
                    return;
                }

                // Delete button
                const deleteBtn = e.target.closest('.delete-btn');
                if (deleteBtn) {
                    deleteTask(id);
                    return;
                }
            });

            // Filter buttons
            filterBtns.forEach(btn => {
                btn.addEventListener('click', function() {
                    const filter = this.getAttribute('data-filter');
                    if (filter === currentFilter) return;
                    currentFilter = filter;
                    render();
                });
            });

            // Clear completed
            clearCompletedBtn.addEventListener('click', clearCompleted);

            // ─── Init ────────────────────────────────────────────────
            loadFromStorage();
            render();

            // Focus input on load (if there are few or no tasks)
            if (tasks.length < 3) {
                input.focus();
            }

        })();
    </script>
</body>
</html>
